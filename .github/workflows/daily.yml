name: Rebuild briefing

# 03:45 UTC = 09:15 IST, every morning. GitHub can delay scheduled runs by a
# few minutes under load; the page always shows its own build time, so a late
# run is visible rather than silently wrong.
on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fatal on any board failure: the run stops here and the last good deploy
      # stays live. A missing Hacker News feed publishes a degraded page instead.
      - name: Regenerate index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_SLUG: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python generate.py

      # Independent check: re-read the archived payloads, recompute a delta,
      # confirm freshness and that the page's status matches build.json.
      - name: Verify against archived payloads
        run: python verify.py

      - name: Commit the page, the manifest and the archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build.json archive
          if git diff --cached --quiet; then
            echo "No change today."
          else
            git commit -m "Briefing $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: rebuild
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - name: Stage the static files
        run: |
          mkdir -p _site
          cp index.html .nojekyll build.json _site/
          cp -r archive _site/archive

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - id: deployment
        uses: actions/deploy-pages@v4
